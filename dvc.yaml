stages:
  preprocess:
    cmd: python src/data/preprocess.py
    deps:
    - data/raw
    - src/data/preprocess.py
    outs:
    - data/processed
  train:
    cmd: python -m src.training.train
    deps:
    - data/processed
    - src/models/model.py
    - src/training/train.py
    outs:
    - artifacts/model.pt
