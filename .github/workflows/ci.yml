name: CI-CD Pipeline

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u 2024ab05243-git --password-stdin

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/2024ab05243-git/mlops-cats-dogs/cats-dogs-api:latest" >> $GITHUB_ENV

      - name: Build image
        run: docker build -t $IMAGE_NAME .

      - name: Push image
        run: docker push $IMAGE_NAME


  deploy:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Pull latest image
        run: docker compose pull

      - name: Deploy container
        run: docker compose up -d

      - name: Wait for service
        run: |
          for i in {1..10}; do
            curl -f http://localhost:8000/health && exit 0
            echo "Waiting..."
            sleep 5
          done
          exit 1
