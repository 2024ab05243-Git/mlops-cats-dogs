name: CI-CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read  # Allow read access to repository contents
  packages: write  # Allow write access to GitHub Container Registry

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u 2024ab05243-git --password-stdin

      - name: Set image name (force lowercase)
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/cats-dogs-api:latest" >> $GITHUB_ENV

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME .

      - name: Push Docker image
        run: docker push $IMAGE_NAME


  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted   # This runs on YOUR machine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u 2024ab05243-git --password-stdin

      - name: Pull latest image
        run: docker compose pull

      - name: Deploy service
        run: docker compose up -d

      - name: Wait for service to be ready
        shell: powershell
        run: |
          for ($i=0; $i -lt 10; $i++) {
              try {
                  Invoke-WebRequest -Uri http://localhost:8000/health -UseBasicParsing
                  Write-Host "Service is up!"
                  exit 0
              } catch {
                  Write-Host "Waiting for service..."
                  Start-Sleep -Seconds 5
              }
          }
          Write-Host "Service failed to start"
          exit 1
